<template>
    <div class="pxa">
        <div class="pxa__masthead">
            <div class="pxa__brand">
                <lightning-icon icon-name="standard:data_cloud" size="small"></lightning-icon>
                <div class="pxa__titles">
                    <p class="pxa__eyebrow">Data Cloud</p>
                    <h1 class="pxa__title">{headerTitle}</h1>
                </div>
            </div>
        </div>

        <div class="pxa__body">
            <template lwc:if={showDetail}>
                <c-profile-explorer-detail
                    unified-id={selectedId}
                    dmo-api-name={selectedDmo}
                    profile-name={selectedName}
                    insight-api-names={insightApiNames}
                    onback={handleBack}
                ></c-profile-explorer-detail>
            </template>

            <template lwc:else>
                <c-profile-explorer-search onview={handleView}></c-profile-explorer-search>
            </template>
        </div>
    </div>
</template>
