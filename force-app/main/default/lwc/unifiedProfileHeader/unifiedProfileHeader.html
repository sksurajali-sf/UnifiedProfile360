<template>
    <article class="slds-card upe-header">
        <template lwc:if={loading}>
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-grid_vertical-align-center">
                    <div class="upe-skeleton upe-skeleton_avatar"></div>
                    <div class="slds-m-left_medium slds-grow">
                        <div class="upe-skeleton upe-skeleton_title"></div>
                        <div class="upe-skeleton upe-skeleton_line slds-m-top_x-small"></div>
                    </div>
                </div>
            </div>
        </template>

        <template lwc:elseif={error}>
            <div class="slds-p-around_medium">
                <div class="slds-text-color_error slds-text-body_regular">
                    <lightning-icon
                        icon-name="utility:error"
                        variant="error"
                        size="x-small"
                        class="slds-m-right_x-small"
                    ></lightning-icon>
                    {error}
                </div>
            </div>
        </template>

        <template lwc:else>
            <div class="upe-header__banner slds-p-around_medium">
                <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                    <div class="upe-avatar" aria-hidden="true">{initials}</div>

                    <div class="slds-m-left_medium slds-grow upe-header__identity">
                        <p class="upe-header__product">{productName}</p>
                        <h1 class="slds-text-heading_medium upe-header__name">{displayName}</h1>
                        <template lwc:if={rulesetLabel}>
                            <div class="slds-m-top_xx-small">
                                <span class="slds-text-body_small upe-header__ruleset">{rulesetLabel}</span>
                            </div>
                        </template>
                    </div>

                    <template lwc:if={hasResolutionDate}>
                        <div class="upe-header__modified slds-text-align_right" title={resolutionDateTitle}>
                            <p class="slds-text-title upe-label">{resolutionDateLabel}</p>
                            <p class="slds-text-body_small">
                                <lightning-formatted-date-time
                                    value={resolutionDate}
                                    year="numeric"
                                    month="short"
                                    day="2-digit"
                                    hour="2-digit"
                                    minute="2-digit"
                                ></lightning-formatted-date-time>
                            </p>
                        </div>
                    </template>
                </div>
            </div>

            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <div class="upe-fieldgrid">
                    <template for:each={fields} for:item="field">
                        <div key={field.key} class="upe-field">
                            <p class="slds-text-title upe-label">{field.label}</p>
                            <p class={field.valueClass} title={field.display}>{field.display}</p>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </article>
</template>
